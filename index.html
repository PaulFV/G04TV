<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070B">
<meta name="description" content="G04TV — Abspieler für eigene IPTV-Playlisten. Läuft auf iPhone, Android und Desktop. Ohne Konto, ohne Server; Playlisten bleiben auf dem Gerät.">
<title>G04TV — IPTV-Playlisten</title>

<!-- Installation als App auf iPhone, Android und Desktop -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G04TV">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/playlists.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<!-- ============ ERSTEINRICHTUNG ============ -->
<div id="onboarding" class="onboarding" hidden>
  <div class="onboarding__inner glass">
    <div class="brand brand--lg">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">G0<b>4</b>TV</span>
      <span class="brand__ver">v1.0.0</span>
    </div>
    <div id="onboardingSteps"></div>
  </div>
</div>

<!-- ============ RAHMEN ============ -->
<div id="app" class="shell" hidden>

  <aside class="sidebar glass">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">G0<b>4</b>TV</span>
    </div>

    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

    <div class="sidebar__foot">
      <div class="now-chip" id="sideNow"></div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="mobileMenuBtn" aria-label="Menü">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="topbar__brand brand" aria-label="G04TV">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">G0<b>4</b>TV</span>
      </div>
      <span class="topbar__divider" aria-hidden="true"></span>
      <div class="topbar__title">
        <h1 id="viewTitle">Start</h1>
        <p id="viewSub"></p>
      </div>
      <div class="topbar__actions">
        <button class="live-chip" id="liveChip" title="Was gerade läuft"><i class="live-chip__dot"></i><span>Nichts läuft</span></button>
        <button class="icon-btn" id="infoBtn" title="Info" aria-label="Info">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.4" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="view-host" id="viewHost"></div>
  </main>

  <nav class="tabbar glass only-mobile" id="tabbar" aria-label="Navigation"></nav>
</div>

<!-- ============ DIE WANDERNDE BÜHNE ============
     Sie lebt ausserhalb der Ansichten: im Bereich Sender zieht sie
     in das Raster ein, sonst laeuft sie unten rechts weiter. -->
<div class="pdock" id="pdock" hidden>
  <div class="stage" id="stage">
    <!-- Kein crossorigin: sonst verlangt der Browser auch beim eingebauten
         Weg CORS-Kopfzeilen, die die wenigsten Anbieter mitschicken. -->
    <video id="video" playsinline webkit-playsinline preload="none"></video>

    <div class="stage__idle" id="stageIdle">
      <span class="stage__mark">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5.5l11 6.5-11 6.5v-13z"/></svg>
      </span>
      <b>Kein Sender</b>
      <p>Wähle links einen Sender — oder trage zuerst eine Playlist ein.</p>
    </div>

    <div class="stage__busy" id="stageBusy"><div class="stage__ring"></div></div>

    <div class="stage__err" id="stageErr">
      <b>Der Sender ließ sich nicht abspielen</b>
      <p id="stageErrText"></p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn--sm" id="stageRetry">Noch einmal</button>
        <button class="btn btn--sm" id="stageExternal">Extern öffnen</button>
      </div>
    </div>

    <div class="stage__bar">
      <button class="icon-btn" id="stageMute" aria-label="Ton"></button>
      <button class="icon-btn" id="stageFull" aria-label="Vollbild"></button>
    </div>
  </div>

  <div class="pdock__bar">
    <b id="pdockTitle">Nichts läuft</b>
    <button class="icon-btn" id="pdockOpen" title="Zum Bereich Sender" aria-label="Zum Bereich Sender">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="icon-btn" id="pdockClose" title="Anhalten" aria-label="Anhalten">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<!-- ============ ÜBERLAGERUNGEN ============ -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet glass" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet__head">
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
  <div class="sheet__body" id="sheetBody"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ============ SKRIPTE (klassisch, damit file:// funktioniert) ============ -->
<script src="js/util.js"></script>
<script src="js/m3u.js"></script>
<script src="js/xtream.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/player.js"></script>
<script src="js/library.js"></script>
<script src="js/dock.js"></script>
<script src="js/view-start.js"></script>
<script src="js/view-live.js"></script>
<script src="js/view-playlists.js"></script>
<script src="js/view-favorites.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/view-info.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/app.js"></script>
</body>
</html>
